<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pingvin Muzeyi 🐧</title>
  <script src="https://telegram.org"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #1a1a2e;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 10px;
      text-align: center;
      font-size: 16px;
      background: #16213e;
      width: 100%;
      border-bottom: 2px solid #0f3460;
    }
    #museum {
      position: relative;
      width: 95vw;
      max-width: 400px;
      height: 55vh;
      background: #e2d1c3;
      border: 8px solid #5c3a21;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .wall {
      position: absolute;
      top: 0;
      width: 100%;
      height: 110px;
      background: #fdf6e3;
      border-bottom: 4px solid #b58900;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 10px;
    }
    .frame {
      width: 70px;
      height: 70px;
      border: 4px solid #d4af37;
      background: #333;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #aaa;
      transition: transform 0.2s;
    }
    .frame.active {
      transform: scale(1.15);
      border-color: #ff4757;
      box-shadow: 0 0 15px #ff4757;
    }
    .frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #penguin {
      position: absolute;
      width: 45px;
      height: 45px;
      font-size: 38px;
      line-height: 45px;
      text-align: center;
      left: 160px;
      top: 220px;
      transition: transform 0.1s;
      z-index: 10;
    }
    #view-btn {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff4757;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      display: none;
      z-index: 20;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 65px);
      grid-template-rows: repeat(2, 65px);
      gap: 8px;
      margin-bottom: 15px;
    }
    .btn {
      background: #0f3460;
      border: 2px solid #e94560;
      color: white;
      font-size: 24px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      active: background #e94560;
    }
    .btn:active { background: #e94560; }
    #modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #modal img {
      max-width: 90%;
      max-height: 70%;
      border: 5px solid #d4af37;
      border-radius: 8px;
    }
    #close-modal {
      margin-top: 20px;
      padding: 10px 25px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <header>🏛 Pingvin Virtual Muzeyi</header>

  <div id="museum">
    <div class="wall" id="wall">
      <div class="frame" id="f0">Bo'sh</div>
      <div class="frame" id="f1">Bo'sh</div>
      <div class="frame" id="f2">Bo'sh</div>
      <div class="frame" id="f3">Bo'sh</div>
    </div>
    <div id="penguin">🐧</div>
    <button id="view-btn" onclick="openPhoto()">👁 Rasmni ko'rish</button>
  </div>

  <div class="controls">
    <div></div>
    <div class="btn" ontouchstart="move(0, -20)" onclick="move(0, -20)">⬆️</div>
    <div></div>
    <div class="btn" ontouchstart="move(-20, 0)" onclick="move(-20, 0)">⬅️</div>
    <div class="btn" ontouchstart="move(0, 20)" onclick="move(0, 20)">⬇️</div>
    <div class="btn" ontouchstart="move(20, 0)" onclick="move(20, 0)">➡️</div>
  </div>

  <div id="modal">
    <img id="modal-img" src="" alt="Eksponat">
    <button id="close-modal" onclick="closePhoto()">Yopish ✖</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // URL dan rasmlarni o'qish
    const params = new URLSearchParams(window.location.search);
    const photosParam = params.get('imgs');
    let photos = [];
    if (photosParam) {
      try {
        photos = JSON.parse(decodeURIComponent(photosParam));
      } catch (e) { console.error(e); }
    }

    // Ramkalarga rasmlarni joylash
    photos.forEach((url, index) => {
      if (index < 4) {
        const frame = document.getElementById('f' + index);
        frame.innerHTML = `<img src="${url}">`;
      }
    });

    const penguin = document.getElementById('penguin');
    const museum = document.getElementById('museum');
    const viewBtn = document.getElementById('view-btn');
    let px = 160, py = 200;
    let activePhoto = null;

    function move(dx, dy) {
      const maxX = museum.clientWidth - 55;
      const maxY = museum.clientHeight - 55;
      px = Math.max(5, Math.min(maxX, px + dx));
      py = Math.max(95, Math.min(maxY, py + dy));
      penguin.style.left = px + 'px';
      penguin.style.top = py + 'px';
      if (dx < 0) penguin.style.transform = 'scaleX(-1)';
      if (dx > 0) penguin.style.transform = 'scaleX(1)';
      checkFrames();
    }

    function checkFrames() {
      activePhoto = null;
      viewBtn.style.display = 'none';
      for (let i = 0; i < 4; i++) {
        const frame = document.getElementById('f' + i);
        frame.classList.remove('active');
        const fCenter = frame.offsetLeft + frame.offsetWidth / 2;
        const pCenter = px + 22;
        if (py < 130 && Math.abs(fCenter - pCenter) < 35 && photos[i]) {
          frame.classList.add('active');
          activePhoto = photos[i];
          viewBtn.style.display = 'block';
        }
      }
    }

    function openPhoto() {
      if (activePhoto) {
        document.getElementById('modal-img').src = activePhoto;
        document.getElementById('modal').style.display = 'flex';
      }
    }

    function closePhoto() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
