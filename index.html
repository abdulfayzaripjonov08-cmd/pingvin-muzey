<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Muzeycha</title>
  <script src="https://telegram.org"></script>
  <script src="https://unpkg.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { overflow: hidden; background: #14100c; font-family: sans-serif; }
    .top { position: fixed; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; z-index: 10; }
    .btn { background: #fff; color: #111; border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; }
    .red { background: #d64550; color: #fff; }
    .cnt { position: fixed; bottom: 25px; left: 20px; background: #fff; padding: 8px 14px; border-radius: 20px; font-weight: bold; z-index: 10; }
    #joy { position: fixed; bottom: 25px; right: 25px; width: 110px; height: 110px; background: rgba(255,255,255,0.25); border: 2px solid #fff; border-radius: 50%; z-index: 20; touch-action: none; }
    #knob { position: absolute; top: 32px; left: 32px; width: 42px; height: 42px; background: #fff; border-radius: 50%; }
    #mod { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #faf6f0; padding: 20px; border-radius: 20px 20px 0 0; z-index: 50; }
    .row { display: flex; gap: 10px; margin: 15px 0; }
    .card { flex: 1; padding: 12px; border: 2px solid #ccc; border-radius: 12px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>
  <div class="top">
    <button class="btn" onclick="mod.style.display='block'">✏️ O'zgartirish</button>
    <button class="btn red" onclick="navigator.share?navigator.share({url:location.href}):alert('Nusxalandi')">📤 Ulashish</button>
  </div>
  <div class="cnt" id="cnt">👁 0 / 4</div>
  <div id="joy"><div id="knob"></div></div>
  <div id="mod">
    <h3>Muzey ko'rinishi</h3>
    <div class="row">
      <div class="card" onclick="theme(0x14100c,0x241d17,0.8)">🌙 Qorong'i</div>
      <div class="card" onclick="theme(0xf5f5f4,0xffffff,1.2)">☀️ Yorug'</div>
      <div class="card" onclick="theme(0x4a0e1c,0x70162b,1.0)">❤️ Sevgi</div>
    </div>
    <button class="btn" style="width:100%;background:#111;color:#fff" onclick="mod.style.display='none'">Tayyor</button>
  </div>
  <script>
    if(window.Telegram && Telegram.WebApp) Telegram.WebApp.expand();
    let photos = [];
    try { const p = new URLSearchParams(location.search).get('imgs'); if(p) photos = JSON.parse(decodeURIComponent(p)); } catch(e){}

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x14100c);
    const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(light);
    const dirLight = new THREE.DirectionalLight(0xffe4b5, 0.8);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(24, 28), new THREE.MeshStandardMaterial({color:0x2b2118}));
    floor.rotation.x = -Math.PI/2;
    scene.add(floor);

    const wallMat = new THREE.MeshStandardMaterial({color:0x241d17});
    const w1 = new THREE.Mesh(new THREE.BoxGeometry(24, 7, 0.5), wallMat); w1.position.set(0, 3.5, -11); scene.add(w1);
    const w2 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 7, 28), wallMat); w2.position.set(-12, 3.5, 0); scene.add(w2);
    const w3 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 7, 28), wallMat); w3.position.set(12, 3.5, 0); scene.add(w3);

    const peng = new THREE.Group();
    const bMat = new THREE.MeshStandardMaterial({color:0x18181b});
    const wMat = new THREE.MeshStandardMaterial({color:0xffffff});
    const oMat = new THREE.MeshStandardMaterial({color:0xff7700});
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.65, 20, 20), bMat); body.scale.set(1,1.3,0.9); body.position.y=0.9; peng.add(body);
    const belly = new THREE.Mesh(new THREE.SphereGeometry(0.55, 20, 20), wMat); belly.scale.set(0.9,1.15,0.5); belly.position.set(0,0.9,0.35); peng.add(belly);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.48, 20, 20), bMat); head.position.set(0,1.9,0); peng.add(head);
    const beak = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.35, 12), oMat); beak.rotation.x=Math.PI/2; beak.position.set(0,1.85,0.55); peng.add(beak);
    const f1 = new THREE.Mesh(new THREE.BoxGeometry(0.25,0.1,0.4), oMat); f1.position.set(-0.25,0.05,0.15);
    const f2 = f1.clone(); f2.position.x=0.25; peng.add(f1,f2);
    peng.position.set(0, 0, 4); peng.rotation.y = Math.PI;
    scene.add(peng);

    const frames = [{x:-4.5,z:-10.6,r:0},{x:4.5,z:-10.6,r:0},{x:-11.6,z:-3,r:Math.PI/2},{x:11.6,z:-3,r:-Math.PI/2}];
    const loader = new THREE.TextureLoader(); loader.setCrossOrigin('anonymous');
    const seen = new Set();

    frames.forEach((f, i) => {
      const g = new THREE.Group();
      g.add(new THREE.Mesh(new THREE.BoxGeometry(2.6, 3.4, 0.15), new THREE.MeshStandardMaterial({color:0xd4af37})));
      const mat = new THREE.MeshBasicMaterial({color:0x444444});
      if(photos[i]) loader.load(photos[i], t => { mat.color.setHex(0xffffff); mat.map=t; mat.needsUpdate=true; });
      const pic = new THREE.Mesh(new THREE.PlaneGeometry(2.3, 3.1), mat); pic.position.z=0.09; g.add(pic);
      g.position.set(f.x, 2.6, f.z); g.rotation.y = f.r; scene.add(g);
    });

    function theme(bg, wl, li) { scene.background.setHex(bg); wallMat.color.setHex(wl); light.intensity = li; }

    let jx=0, jy=0, drag=false;
    joy.ontouchstart = e => { drag=true; moveJoy(e.touches[0]); };
    joy.ontouchmove = e => { if(drag){ e.preventDefault(); moveJoy(e.touches[0]); } };
    joy.ontouchend = () => { drag=false; jx=0; jy=0; knob.style.transform='translate(0,0)'; };
    function moveJoy(t) {
      const r = joy.getBoundingClientRect(), dx = t.clientX-(r.left+55), dy = t.clientY-(r.top+55);
      const d = Math.min(35, Math.hypot(dx,dy)), a = Math.atan2(dy,dx);
      jx = Math.cos(a)*d/35; jy = Math.sin(a)*d/35;
      knob.style.transform = `translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`;
    }

    let step = 0;
    function loop() {
      requestAnimationFrame(loop);
      if(Math.abs(jx)>0.05 || Math.abs(jy)>0.05) {
        peng.position.x = Math.max(-10, Math.min(10, peng.position.x + jx*0.12));
        peng.position.z = Math.max(-9, Math.min(10, peng.position.z + jy*0.12));
        peng.rotation.y = Math.atan2(jx, jy);
        step += 0.25; peng.rotation.z = Math.sin(step)*0.12; peng.position.y = Math.abs(Math.cos(step))*0.08;
      } else { peng.rotation.z=0; peng.position.y=0; }

      camera.position.set(peng.position.x, 3.2, peng.position.z + 5.2);
      camera.lookAt(peng.position.x, 1.8, peng.position.z - 2);

      frames.forEach((f, i) => {
        if(Math.hypot(peng.position.x-f.x, peng.position.z-f.z)<4.5 && photos[i]) {
          seen.add(i); cnt.innerText = `👁 ${seen.size} / ${Math.min(4, photos.length)}`;
        }
      });
      renderer.render(scene, camera);
    }
    loop();
  </script>
</body>
</html>
